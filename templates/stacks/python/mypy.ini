# 검사 키트의 mypy 설정이다. types 단계가 --config-file로 넘긴다. 보호 파일이다.
# enable_error_code의 일곱 코드는 mypy 2.4.0이 모두 받는다(2026-10-19 확인). 뺀 코드는 없다.
# pydantic을 쓰지 않는 프로젝트는 plugins 줄과 [pydantic-mypy] 절을 지운다.
# 스텁이 없는 SDK는 [mypy-<모듈>.*] 절에 ignore_missing_imports = True를 모듈마다 둔다.
# 전체에 걸지 않는다.

[mypy]
strict = True
warn_unreachable = True
enable_error_code = ignore-without-code, redundant-expr, truthy-bool, possibly-undefined, unused-awaitable, deprecated, exhaustive-match
plugins = pydantic.mypy

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
