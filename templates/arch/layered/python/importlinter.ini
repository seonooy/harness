# layered 조각의 import-linter 계약이다. architecture 단계가 읽는다. 보호 파일이다.
# 루트 패키지를 첫 스타일(layered)로 둔 계약이다. 정본은 .agents/skills/kit-architecture/styles/layered.md의
# 계약 조각이고, 이 파일은 그 조각의 {pkg}·{short}를 루트 패키지 이름으로 채운 것이다.
# 계약 id는 .ai/project/architecture.md의 [검사: architecture/<id>]와 같아야 한다(check doctor가 맞춰 본다).
# 하위 패키지의 스타일이나 패키지 사이 관계를 더하거나 바꿀 때는 kit-architecture를 따른다.
# 이 파일은 보호 파일이라 에이전트는 .ai/proposals/에 제안을 두고, 사용자가 harness.py proposal apply로 적용한다.

[importlinter]
root_package = <<FILL: 최상위 패키지. 예: app>>
include_external_packages = True

[importlinter:contract:<<FILL: 최상위 패키지. 예: app>>-layers]
name = <<FILL: 최상위 패키지. 예: app>> layers
type = layers
containers =
    <<FILL: 최상위 패키지. 예: app>>
layers =
    api
    services
    (repositories) | (clients)
    models : (schemas)
    (core)
exhaustive = True
broken_contract_guidance =
    위 층은 아래 층만 import한다(api -> services -> repositories|clients -> models·schemas -> core).
    아래 층이 위 층을 부르면 함수 인자로 넘겨받거나, 같이 쓰는 코드를 아래 층으로 내린다.
    새 모듈은 이 목록의 층 하나에 넣는다.

[importlinter:contract:<<FILL: 최상위 패키지. 예: app>>-framework-at-edge]
name = <<FILL: 최상위 패키지. 예: app>> framework only in api
type = forbidden
source_modules =
    <<FILL: 최상위 패키지. 예: app>>.services
    <<FILL: 최상위 패키지. 예: app>>.models
forbidden_modules =
    fastapi
    starlette
broken_contract_guidance =
    웹 프레임워크는 api 층에서만 쓴다. services는 도메인 예외를 던지고 api가 HTTP 응답으로 바꾼다.
