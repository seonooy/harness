# ddd 조각의 import-linter 계약이다. architecture 단계가 읽는다. 보호 파일이다.
# 루트 패키지를 첫 스타일(hexagonal)로 둔 계약이다. 정본은 .agents/skills/kit-architecture/styles/hexagonal.md의
# 계약 조각이고, 이 파일은 그 조각의 {pkg}·{short}를 루트 패키지 이름으로 채운 것이다.
# 계약 id는 .ai/project/architecture.md의 [검사: architecture/<id>]와 같아야 한다(check doctor가 맞춰 본다).
# 하위 패키지의 스타일이나 패키지 사이 관계를 더하거나 바꿀 때는 kit-architecture를 따른다.
# 이 파일은 보호 파일이라 에이전트는 .ai/proposals/에 제안을 두고, 사용자가 harness.py proposal apply로 적용한다.

[importlinter]
root_package = <<FILL: 최상위 패키지. 예: app>>
include_external_packages = True

[importlinter:contract:<<FILL: 최상위 패키지. 예: app>>-layers]
name = <<FILL: 최상위 패키지. 예: app>> hexagon
type = layers
containers =
    <<FILL: 최상위 패키지. 예: app>>
layers =
    (bootstrap)
    (http) | (worker) | adapters
    application
    domain : (events)
exhaustive = True
broken_contract_guidance =
    바깥에서 안쪽으로만 import한다: bootstrap -> http|worker|adapters -> application -> domain.
    application이 어댑터를 직접 부르면 application에 포트(Protocol)를 두고 adapters가 구현하게 한 뒤 bootstrap에서 넣는다.
    http, worker, adapters는 서로 import하지 않는다.

[importlinter:contract:<<FILL: 최상위 패키지. 예: app>>-domain-pure]
name = <<FILL: 최상위 패키지. 예: app>> inside uses no infrastructure
type = forbidden
source_modules =
    <<FILL: 최상위 패키지. 예: app>>.application
    <<FILL: 최상위 패키지. 예: app>>.domain
forbidden_modules =
    fastapi
    starlette
broken_contract_guidance =
    domain과 application은 웹 프레임워크, 외부 변환기, JVM 연결, 저장소 라이브러리를 쓰지 않는다.
    필요한 기능은 application에 포트로 정의하고 adapters에서 구현한다.
